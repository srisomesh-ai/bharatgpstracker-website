<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FF423D">
<title>Bharat GPS Admin</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Bharat GPS website admin (Oct 2026): sidebar of sections | working area; store items edit in a slide-in drawer.
   Colours from the logo: pin red, map teal. */
:root{
  --bg:#F4F6F8;--panel:#FFFFFF;--ink:#1E2430;--mute:#677184;--line:#E3E7ED;
  --red:#FF423D;--red-ink:#D92F2A;--red-soft:#FFEDEC;--teal:#119C90;--teal-soft:#E2F5F3;--blue:#2F8FD6;--blue-soft:#E4F1FB;--amber:#B86E00;--amber-soft:#FFF2DB;--ok:#12925A;--ok-soft:#E1F5EA;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#11151C;--panel:#1A2029;--ink:#E8ECF2;--mute:#9AA4B5;--line:#2A323E;--red:#FF6B66;--red-ink:#FF8A86;--red-soft:#3A1E21;--teal:#3CC7BA;--teal-soft:#16302E;--blue:#62B2F0;--blue-soft:#172A3B;--amber:#F2B44C;--amber-soft:#3A2C12;--ok:#43D18F;--ok-soft:#173528;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button,input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--ink)}
.hide{display:none!important}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:16px}
.brand img{width:34px;height:34px;object-fit:contain}
.brand small{display:block;font-weight:600;font-size:11px;color:var(--mute);letter-spacing:.04em}
.nav{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav[aria-current="page"]{background:var(--red-soft);color:var(--red-ink)}
.nav b{font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:1px 7px}
.nav b:empty{display:none}
.side .sep{height:1px;background:var(--line);margin:10px 4px}
.side .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:8px 12px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
main{padding:24px 28px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font-size:22px;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--mute);max-width:640px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.red{color:var(--red-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.sw:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat span{display:block;color:var(--mute);font-size:12px;font-weight:600}
.stat b{display:block;font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{color:var(--mute);font-weight:600;font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.card h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h2 button{border:0;background:none;font-size:12px;color:var(--teal);font-weight:700;cursor:pointer;font-family:var(--sans)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mute);font-size:12px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-new{background:var(--blue-soft);color:var(--blue)}.c-warn{background:var(--amber-soft);color:var(--amber)}.c-off{background:var(--bg);color:var(--mute)}.c-red{background:var(--red-soft);color:var(--red-ink)}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:26px;height:26px}
.prow{display:flex;gap:12px;align-items:center}
.price s{color:var(--mute);font-size:12px;margin-left:4px}
.tools{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools input,.tools select,td select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px}
.tools input{flex:1;min-width:180px}
.tools label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--line);border:0;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--teal)}.sw[aria-checked="true"]::after{left:19px}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:11px;line-height:1;padding:2px 4px}.mv button:hover{color:var(--ink)}
.shade{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.2)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:17px}
.drawer .body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;font-weight:500;width:100%}
label.f textarea{min-height:90px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--mute);font-weight:500;line-height:1.5}
.err{color:var(--red-ink);font-size:13px;font-weight:600;min-height:18px}
.up{border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center}
.up .thumb{width:72px;height:72px}
.up div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.toggle div b{display:block;font-size:13px}.toggle div span{font-size:12px;color:var(--mute)}
.form{padding:18px;display:flex;flex-direction:column;gap:14px}
.sec{display:grid;gap:14px;min-width:0}
.li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}.li .grow b{display:block}.li .grow span{color:var(--mute);font-size:13px;display:block;margin-top:2px}
.li .side-acts{display:flex;gap:8px;align-items:center;flex:none}
.stars{color:#E5A100;letter-spacing:1px}
.empty{padding:36px 20px;text-align:center;color:var(--mute);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100vw - 32px)}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.5}
.ask{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:30;display:grid;place-items:center;padding:16px}
.ask .card{max-width:400px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.ask h3{margin:0;font-size:17px}.ask p{margin:0;color:var(--mute);line-height:1.5}
.ask .acts{display:flex;justify-content:flex-end;gap:8px}
/* sign in */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:100%;max-width:380px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login img{width:180px;align-self:center}
.login h1{margin:0;font-size:19px;text-align:center}.login p{margin:0;color:var(--mute);text-align:center;line-height:1.5}
.mtop{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand,.side .sep,.side .foot{display:none}
  .nav{white-space:nowrap;padding:8px 12px}
  main{padding:18px 16px 60px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.row2,.row3{grid-template-columns:1fr}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);font-weight:800}
  .mtop img{height:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="login hide" id="login">
  <div class="card">
    <img src="../assets/logo.png" alt="Bharat GPS Tracker">
    <h1 id="lTitle">Admin sign in</h1>
    <p id="lText">Sign in to manage the website.</p>
    <label class="f">Password<input id="lPw" type="password" autocomplete="current-password"></label>
    <label class="f hide" id="lPw2w">Type the password again<input id="lPw2" type="password" autocomplete="new-password"></label>
    <div class="err" id="lErr"></div>
    <button class="btn pri" id="lGo" style="justify-content:center;padding:11px">Sign in</button>
  </div>
</div>

<div id="appWrap" class="hide">
<div class="mtop"><img src="../assets/logo.png" alt="Bharat GPS Tracker"><a class="btn sm" href="../livechat/agent.html">Chat desk</a></div>
<div class="app">
  <nav class="side" aria-label="Admin sections">
    <div class="brand"><img src="../assets/logo-square.png" alt=""><div>Bharat GPS<small>WEBSITE ADMIN</small></div></div>
    <button class="nav" data-s="dash">Dashboard</button>
    <button class="nav" data-s="prod">Store items</button>
    <button class="nav" data-s="ord">Orders <b id="nOrd"></b></button>
    <button class="nav" data-s="lead">Callback requests <b id="nLead"></b></button>
    <button class="nav" data-s="site">Website content</button>
    <button class="nav" data-s="faq">FAQs &amp; reviews</button>
    <button class="nav" data-s="set">Settings</button>
    <div class="sep"></div>
    <a class="nav" href="../livechat/agent.html">Chat desk ↗</a>
    <a class="nav" href="../" target="_blank" rel="noopener">View website ↗</a>
    <div class="foot">Changes show on the website as soon as you save.<button class="btn sm" id="logout" style="align-self:flex-start">Sign out</button></div>
  </nav>
  <main id="main"></main>
</div>
</div>
<div id="layer"></div>

<script>
var API='../api.php',TOKEN='',cur='dash',cache={};
var ICON={bike:'<svg viewBox="0 0 24 24" fill="none" stroke="#2F8FD6" stroke-width="1.8"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l5-7h4l3 7"/></svg>',
car:'<svg viewBox="0 0 24 24" fill="none" stroke="#FF423D" stroke-width="1.8"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>',
truck:'<svg viewBox="0 0 24 24" fill="none" stroke="#119C90" stroke-width="1.8"><rect x="2" y="7" width="13" height="10" rx="1"/><path d="M15 10h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
bus:'<svg viewBox="0 0 24 24" fill="none" stroke="#B86E00" stroke-width="1.8"><rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg>',
person:'<svg viewBox="0 0 24 24" fill="none" stroke="#677184" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'};
var CATS=['Two-wheeler','Car','Commercial / AIS-140','School bus','Personal'];
var CAT_ICON={'Two-wheeler':'bike','Car':'car','Commercial / AIS-140':'truck','School bus':'bus','Personal':'person'};
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function inr(n){return'₹'+Number(n||0).toLocaleString('en-IN')}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function api(action,o,cb){var f=(o instanceof FormData)?o:new FormData();f.append('action',action);if(!(o instanceof FormData))for(var k in (o||{}))f.append(k,o[k]);
  fetch(API+'?action='+action+'&_='+Date.now(),{method:'POST',headers:{'X-Admin-Token':TOKEN},body:f,cache:'no-store'}).then(function(r){return r.json()})
  .then(function(r){if(!r.ok&&r.auth){signOut('Please sign in again.');return}cb(r)}).catch(function(){cb({ok:false,error:'No connection. Check the internet and try again.'})})}
function when(ts){return new Date(ts*1000).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function phone(p){return p?'+91 '+p.slice(0,5)+' '+p.slice(5):''}
function chip(s){var m={'New':'c-new','Paid':'c-ok','paid':'c-ok','Installed':'c-ok','Converted':'c-ok','Install scheduled':'c-warn','Called':'c-off','Not interested':'c-off','Cancelled':'c-red','In stock':'c-ok','Made to order':'c-warn','Out of stock':'c-red'};return'<span class="chip '+(m[s]||'c-off')+'">'+esc(s)+'</span>'}
function payChip(o){return o.pay_method==='online'?(o.pay_status==='paid'?'<span class="chip c-ok">Paid online</span>':'<span class="chip c-red">Not paid</span>'):(o.pay_status==='paid'?'<span class="chip c-ok">Paid at install</span>':'<span class="chip c-warn">Pay on install</span>')}
function head(t,p,acts){return'<div class="head"><div><h1>'+t+'</h1><p>'+p+'</p></div><div class="acts">'+(acts||'')+'</div></div>'}
function csv(name,rows){var s='﻿'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function ask(title,text,okLabel,cb){el('layer').insertAdjacentHTML('beforeend','<div class="ask" id="askBox" role="dialog" aria-label="'+esc(title)+'"><div class="card"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="acts"><button class="btn" id="askNo">Cancel</button><button class="btn pri" id="askYes" style="background:var(--red);border-color:var(--red)">'+esc(okLabel)+'</button></div></div></div>');
  el('askNo').onclick=function(){el('askBox').remove()};el('askYes').onclick=function(){el('askBox').remove();cb()};el('askYes').focus()}

/* ---------- sign in ---------- */
var setupMode=false;
function showLogin(msg){el('appWrap').classList.add('hide');el('login').classList.remove('hide');
  api('status',{},function(r){setupMode=r.ok&&r.setup;el('lTitle').textContent=setupMode?'Create the admin password':'Admin sign in';
    el('lText').textContent=setupMode?'First time here. Choose a password of at least 8 characters. You will use it for this admin panel and the Chat desk.':'Sign in to manage the website.';
    el('lPw2w').classList.toggle('hide',!setupMode);el('lPw').autocomplete=setupMode?'new-password':'current-password';el('lGo').textContent=setupMode?'Create password and sign in':'Sign in';el('lErr').textContent=msg||'';el('lPw').focus()})}
el('lGo').onclick=function(){var p=el('lPw').value;if(!p){el('lErr').textContent='Enter the password';return}
  if(setupMode&&p!==el('lPw2').value){el('lErr').textContent='The two passwords do not match';return}
  var b=this;b.disabled=true;api(setupMode?'setup':'login',{password:p},function(r){b.disabled=false;if(!r.ok){el('lErr').textContent=r.error;return}
    TOKEN=r.token;ls('bgt_token',TOKEN);el('lPw').value='';el('lPw2').value='';start()})};
el('lPw').onkeydown=el('lPw2').onkeydown=function(e){if(e.key==='Enter')el('lGo').click()};
function signOut(msg){if(TOKEN&&!msg)api('logout',{},function(){});TOKEN='';ls('bgt_token',null);showLogin(msg)}
el('logout').onclick=function(){signOut()};
function start(){el('login').classList.add('hide');el('appWrap').classList.remove('hide');var h=location.hash.slice(1);show(V[h]?h:'dash');counts()}
function counts(){api('dash',{},function(r){if(!r.ok)return;el('nOrd').textContent=r.new_orders||'';el('nLead').textContent=r.new_leads||''})}
setInterval(function(){if(TOKEN)counts()},60000);

/* ---------- sections ---------- */
function show(s){cur=s;history.replaceState(null,'','#'+s);document.querySelectorAll('.side .nav[data-s]').forEach(function(b){if(b.dataset.s===s)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  el('main').innerHTML='<div class="empty">Loading…</div>';V[s]();window.scrollTo(0,0)}
var V={};
V.dash=function(){api('dash',{},function(r){if(!r.ok){el('main').innerHTML='<div class="empty">'+esc(r.error)+'</div>';return}
  var hr=new Date().getHours(),hi=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  el('main').innerHTML=head(hi,'What happened on the website today.')+
  (!r.rzp?'<div class="banner"><b>Online payment is not connected yet.</b> Customers can book with pay on installation. To take UPI and card payments, add the Razorpay keys to config.php on the server.</div>':'')+
  '<div class="stats"><div class="card stat"><span>Orders today</span><b>'+r.orders_today+'</b><small>'+inr(r.sales_today)+'</small></div><div class="card stat"><span>Callback requests waiting</span><b>'+r.new_leads+'</b><small>'+r.leads_today+' today</small></div>'+
  '<div class="card stat"><span>Visitors on the site now</span><b>'+r.live+'</b><small><a href="../livechat/agent.html" style="color:var(--teal)">Open Chat desk</a></small></div><div class="card stat"><span>Store items live</span><b>'+r.products_live+' / '+r.products_all+'</b><small>'+(r.products_all-r.products_live)+' hidden</small></div></div>'+
  '<div class="grid2"><div class="card"><h2>Latest orders <button data-go="ord">See all</button></h2>'+(r.orders.length?'<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Item</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+

  '<label class="f">Email new orders and callback requests to<input id="sMail" type="email" value="'+esc(s.alert_email)+'"></label><div class="err" id="sErr"></div><button class="btn pri" id="sSave" style="align-self:flex-start">Save</button></div></div>'+
  '<div class="card"><h2>Admin password</h2><div class="form"><span class="hint">The same password opens the Chat desk. Changing it signs out every other device.</span>'+
  '<label class="f">Current password<input id="pOld" type="password" autocomplete="current-password"></label><label class="f">New password (at least 8 characters)<input id="pNew" type="password" autocomplete="new-password"></label>'+
  '<div class="err" id="pErr"></div><button class="btn pri" id="pSave" style="align-self:flex-start">Change password</button></div></div></div>';
  el('sSave').onclick=function(){var o={alert_email:el('sMail').value};document.querySelectorAll('[data-set]').forEach(function(x){if(!x.disabled)o[x.dataset.set]=x.getAttribute('aria-checked')==='true'?'1':'0'});
    api('settings_save',o,function(r){if(!r.ok){el('sErr').textContent=r.error;return}el('sErr').textContent='';toast('Settings saved')})};
  el('pSave').onclick=function(){api('password',{old:el('pOld').value,'new':el('pNew').value},function(r){if(!r.ok){el('pErr').textContent=r.error;return}TOKEN=r.token;ls('bgt_token',TOKEN);el('pOld').value=el('pNew').value='';el('pErr').textContent='';toast('Password changed')})}})};

/* ---------- clicks ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('button,[data-close]');if(!t)return;var d=t.dataset;
  if(d.s){show(d.s);return}
  if(d.go){show(d.go);return}
  if(t.hasAttribute('data-close')){el('layer').innerHTML='';return}
  if(d.edit!==undefined){editor(+d.edit);return}
  if(d.faq!==undefined){itemEditor('faq',+d.faq);return}
  if(d.rev!==undefined){itemEditor('review',+d.rev);return}
  if(d.mv){api('product_move',{id:d.id,dir:d.mv},V.prod);return}
  if(d.imv){api('item_move',{kind:d.kind,id:d.id,dir:d.imv},V.faq);return}
  if(d.opaid){api('order_update',{id:d.opaid,status:cache.orders.filter(function(o){return+o.id===+d.opaid})[0].status,paid:'1'},function(){toast('Marked as paid');V.ord()});return}
  if(t.classList.contains('sw')&&!t.disabled){var on=t.getAttribute('aria-checked')!=='true';t.setAttribute('aria-checked',on?'true':'false');
    if(d.pv)api('product_toggle',{id:d.pv,visible:on?'1':'0'},function(r){toast(r.ok?(on?'Now showing on the website':'Hidden from the website'):r.error)});
    if(d.itog)api('item_toggle',{kind:d.itog,id:d.id,visible:on?'1':'0'},function(r){toast(r.ok?(on?'Now showing on the website':'Hidden from the website'):r.error)})}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset.ost){var o=cache.orders.filter(function(x){return+x.id===+t.dataset.ost})[0];api('order_update',{id:o.id,status:t.value,note:o.note||''},function(r){if(r.ok){o.status=t.value;toast('Order '+o.code+': '+t.value);counts()}else toast(r.error)})}
  if(t.dataset.lst){api('lead_update',{id:t.dataset.lst,status:t.value},function(r){if(r.ok){cache.leads.filter(function(x){return+x.id===+t.dataset.lst})[0].status=t.value;toast('Saved');counts()}else toast(r.error)})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(el('askBox'))el('askBox').remove();else el('layer').innerHTML=''}});

TOKEN=ls('bgt_token')||'';
if(TOKEN)api('dash',{},function(r){if(r.ok)start();else if(!r.auth)showLogin(r.error)});else showLogin();
</script>
</body>
</html>
